<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            font-weight: 600;
        }

        button:hover {
            background: #764ba2;
        }

        button.delete-btn {
            background: #e74c3c;
            padding: 8px 12px;
            width: auto;
            font-size: 0.9em;
        }

        button.delete-btn:hover {
            background: #c0392b;
        }

        .student-item {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .student-name {
            font-weight: 600;
            color: #333;
        }

        .student-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .attendance-record {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #27ae60;
        }

        .attendance-record.absent {
            border-left-color: #e74c3c;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .record-student {
            font-weight: 600;
            color: #333;
        }

        .record-status {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .record-status.present {
            background: #d4edda;
            color: #155724;
        }

        .record-status.absent {
            background: #f8d7da;
            color: #721c24;
        }

        .record-date {
            color: #666;
            font-size: 0.9em;
        }

        .attendance-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .stats {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #ddd;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Attendance Tracker</h1>
            <p>Manage student attendance efficiently</p>
        </div>

        <div class="content">
            <!-- Add Student Card -->
            <div class="card">
                <h2>Add Student</h2>
                <div class="success-message" id="addStudentSuccess"></div>
                <div class="error-message" id="addStudentError"></div>
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter student name">
                </div>
                <button onclick="addStudent()">Add Student</button>
                <div class="student-list">
                    <div style="margin-top: 20px;">
                        <h3 style="color: #667eea; margin-bottom: 10px;">Students List</h3>
                        <div id="studentsList"></div>
                    </div>
                </div>
            </div>

            <!-- Mark Attendance Card -->
            <div class="card">
                <h2>Mark Attendance</h2>
                <div class="success-message" id="attendanceSuccess"></div>
                <div class="error-message" id="attendanceError"></div>
                <div class="form-group">
                    <label for="studentSelect">Select Student</label>
                    <select id="studentSelect">
                        <option value="">-- Choose a student --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="attendanceDate">Date</label>
                    <input type="date" id="attendanceDate">
                </div>
                <div class="form-group">
                    <label for="attendanceStatus">Status</label>
                    <select id="attendanceStatus">
                        <option value="present">✓ Present</option>
                        <option value="absent">✗ Absent</option>
                    </select>
                </div>
                <button onclick="markAttendance()">Record Attendance</button>
            </div>
        </div>

        <!-- Attendance Records Card -->
        <div class="card">
            <h2>Attendance Records</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('all-records')">All Records</button>
                <button class="tab-btn" onclick="switchTab('student-view')">Student View</button>
            </div>

            <div id="all-records" class="tab-content active">
                <div class="attendance-list" id="attendanceList"></div>
            </div>

            <div id="student-view" class="tab-content">
                <div class="form-group">
                    <label for="viewStudentSelect">Select Student</label>
                    <select id="viewStudentSelect">
                        <option value="">-- Choose a student --</option>
                    </select>
                </div>
                <div class="attendance-list" id="studentAttendanceList"></div>
                <div class="stats" id="studentStats"></div>
            </div>
        </div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('attendanceDate').valueAsDate = new Date();

        // Load initial data
        loadStudents();
        loadAttendance();

        function showMessage(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }

        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                showMessage('addStudentError', 'Please enter a student name', true);
                return;
            }

            fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('addStudentSuccess', 'Student added successfully!');
                    document.getElementById('studentName').value = '';
                    loadStudents();
                } else {
                    showMessage('addStudentError', data.message, true);
                }
            })
            .catch(error => {
                showMessage('addStudentError', 'Error adding student', true);
                console.error('Error:', error);
            });
        }

        function deleteStudent(name) {
            if (confirm(`Delete student "${name}" and all their records?`)) {
                fetch(`/api/delete-student/${encodeURIComponent(name)}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadStudents();
                        loadAttendance();
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }

        function loadStudents() {
            fetch('/api/students')
                .then(response => response.json())
                .then(data => {
                    const students = data.students;
                    
                    // Update students list
                    const listHtml = students.map(student => `
                        <div class="student-item">
                            <span class="student-name">${escapeHtml(student)}</span>
                            <button class="delete-btn" onclick="deleteStudent('${student.replace(/'/g, "\\'")}')">Delete</button>
                        </div>
                    `).join('');
                    document.getElementById('studentsList').innerHTML = listHtml || '<p style="color: #999;">No students yet</p>';
                    
                    // Update student select dropdowns
                    const selectHtml = '<option value="">-- Choose a student --</option>' + 
                        students.map(student => `<option value="${student}">${student}</option>`).join('');
                    document.getElementById('studentSelect').innerHTML = selectHtml;
                    document.getElementById('viewStudentSelect').innerHTML = selectHtml;
                })
                .catch(error => console.error('Error:', error));
        }

        function markAttendance() {
            const student = document.getElementById('studentSelect').value;
            const date = document.getElementById('attendanceDate').value;
            const status = document.getElementById('attendanceStatus').value;

            if (!student || !date) {
                showMessage('attendanceError', 'Please select a student and date', true);
                return;
            }

            fetch('/api/attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student, date, status })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('attendanceSuccess', 'Attendance recorded successfully!');
                    loadAttendance();
                } else {
                    showMessage('attendanceError', data.message, true);
                }
            })
            .catch(error => {
                showMessage('attendanceError', 'Error recording attendance', true);
                console.error('Error:', error);
            });
        }

        function loadAttendance() {
            fetch('/api/attendance')
                .then(response => response.json())
                .then(data => {
                    const records = data.attendance.sort((a, b) => 
                        new Date(b.date) - new Date(a.date)
                    );
                    
                    const html = records.map(record => {
                        const statusClass = record.status === 'present' ? 'present' : 'absent';
                        const statusText = record.status === 'present' ? '✓ Present' : '✗ Absent';
                        return `
                            <div class="attendance-record ${statusClass}">
                                <div class="record-header">
                                    <span class="record-student">${escapeHtml(record.student)}</span>
                                    <span class="record-status ${statusClass}">${statusText}</span>
                                </div>
                                <div class="record-date">${new Date(record.date).toLocaleDateString()}</div>
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('attendanceList').innerHTML = html || '<p style="color: #999;">No attendance records yet</p>';
                })
                .catch(error => console.error('Error:', error));
        }

        function viewStudentAttendance() {
            const student = document.getElementById('viewStudentSelect').value;
            if (!student) {
                document.getElementById('studentAttendanceList').innerHTML = '';
                document.getElementById('studentStats').innerHTML = '';
                return;
            }

            fetch(`/api/attendance/${encodeURIComponent(student)}`)
                .then(response => response.json())
                .then(data => {
                    const records = data.attendance.sort((a, b) => 
                        new Date(b.date) - new Date(a.date)
                    );
                    
                    const present = records.filter(r => r.status === 'present').length;
                    const absent = records.filter(r => r.status === 'absent').length;
                    const total = records.length;
                    const percentage = total > 0 ? ((present / total) * 100).toFixed(1) : 0;

                    const html = records.map(record => {
                        const statusClass = record.status === 'present' ? 'present' : 'absent';
                        const statusText = record.status === 'present' ? '✓ Present' : '✗ Absent';
                        return `
                            <div class="attendance-record ${statusClass}">
                                <div class="record-header">
                                    <span class="record-student">${escapeHtml(record.student)}</span>
                                    <span class="record-status ${statusClass}">${statusText}</span>
                                </div>
                                <div class="record-date">${new Date(record.date).toLocaleDateString()}</div>
                            </div>
                        `;
                    }).join('');

                    document.getElementById('studentAttendanceList').innerHTML = html || '<p style="color: #999;">No records for this student</p>';
                    
                    document.getElementById('studentStats').innerHTML = `
                        <div class="stat-item">
                            <span class="stat-label">Total Sessions:</span>
                            <span class="stat-value">${total}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Present:</span>
                            <span class="stat-value" style="color: #27ae60;">${present}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Absent:</span>
                            <span class="stat-value" style="color: #e74c3c;">${absent}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Attendance Rate:</span>
                            <span class="stat-value">${percentage}%</span>
                        </div>
                    `;
                })
                .catch(error => console.error('Error:', error));
        }

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Load student view data if switching to it
            if (tabName === 'student-view') {
                const studentSelect = document.getElementById('viewStudentSelect');
                if (studentSelect.value) {
                    viewStudentAttendance();
                }
            }
        }

        document.getElementById('viewStudentSelect').addEventListener('change', viewStudentAttendance);

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
