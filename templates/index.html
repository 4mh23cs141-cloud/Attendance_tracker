<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: #333;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(102, 126, 234, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: slideInDown 0.7s ease-out;
        }

        .header h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            font-weight: 800;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.3em;
            opacity: 0.98;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2.2em;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.12),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            animation: fadeIn 0.7s ease-out;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 35px 100px rgba(0, 0, 0, 0.18),
                        inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .card h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 28px;
            font-size: 1.8em;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #f9f9f9 0%, #ffffff 100%);
            font-weight: 500;
        }

        input[type="text"]::placeholder {
            color: #bbb;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 6px rgba(102, 126, 234, 0.15),
                        inset 0 0 0 1px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            width: 100%;
            font-weight: 700;
            letter-spacing: 0.7px;
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.35),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(102, 126, 234, 0.45),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        button.delete-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            padding: 8px 14px;
            width: auto;
            font-size: 0.85em;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.2);
            border-radius: 6px;
        }

        button.delete-btn:hover {
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .student-item {
            background: linear-gradient(135deg, rgba(245, 247, 250, 0.9) 0%, rgba(195, 207, 226, 0.7) 100%);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #667eea;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideInUp 0.5s ease-out;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .student-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 14px 0 0 14px;
        }

        .student-item:hover {
            transform: translateX(8px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        .student-name {
            font-weight: 700;
            color: #333;
            flex: 1;
        }

        .student-list {
            max-height: 450px;
            overflow-y: auto;
        }

        .success-message {
            background: linear-gradient(135deg, rgba(212, 237, 218, 0.95) 0%, rgba(195, 230, 203, 0.95) 100%);
            color: #155724;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            border-left: 5px solid #28a745;
            font-weight: 700;
            animation: slideInDown 0.4s ease-out;
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.2);
            backdrop-filter: blur(10px);
        }

        .error-message {
            background: linear-gradient(135deg, rgba(248, 215, 218, 0.95) 0%, rgba(245, 198, 203, 0.95) 100%);
            color: #721c24;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            border-left: 5px solid #dc3545;
            font-weight: 700;
            animation: slideInDown 0.4s ease-out;
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.2);
            backdrop-filter: blur(10px);
        }

        .attendance-record {
            background: linear-gradient(135deg, rgba(240, 249, 255, 0.9) 0%, rgba(230, 243, 255, 0.7) 100%);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 14px;
            border-left: 5px solid #27ae60;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideInUp 0.5s ease-out;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(39, 174, 96, 0.2);
            position: relative;
        }

        .attendance-record::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(180deg, #27ae60 0%, #229954 100%);
            border-radius: 14px 0 0 14px;
        }

        .attendance-record:hover {
            transform: translateX(6px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.2);
        }

        .attendance-record.absent {
            border-left-color: #e74c3c;
            background: linear-gradient(135deg, rgba(255, 245, 245, 0.9) 0%, rgba(255, 230, 230, 0.7) 100%);
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .attendance-record.absent::before {
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .record-student {
            font-weight: 700;
            color: #333;
        }

        .record-status {
            padding: 7px 16px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 700;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .record-status.present {
            background: linear-gradient(135deg, rgba(212, 237, 218, 0.95) 0%, rgba(195, 230, 203, 0.95) 100%);
            color: #155724;
            border: 1px solid rgba(39, 174, 96, 0.3);
        }

        .record-status.absent {
            background: linear-gradient(135deg, rgba(248, 215, 218, 0.95) 0%, rgba(245, 198, 203, 0.95) 100%);
            color: #721c24;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .record-date {
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }

        .attendance-list {
            max-height: 450px;
            overflow-y: auto;
        }

        .stats {
            background: linear-gradient(135deg, rgba(248, 249, 250, 0.95) 0%, rgba(240, 242, 245, 0.95) 100%);
            padding: 25px;
            border-radius: 16px;
            margin-top: 25px;
            border: 1px solid rgba(102, 126, 234, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            animation: slideInUp 0.6s ease-out;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .stat-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .stat-item:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .stat-label {
            color: #555;
            font-weight: 700;
            font-size: 1.05em;
        }

        .stat-value {
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.4em;
        }

        .tabs {
            display: flex;
            gap: 14px;
            margin-bottom: 28px;
            background: linear-gradient(135deg, rgba(240, 242, 245, 0.7) 0%, rgba(230, 235, 250, 0.7) 100%);
            padding: 8px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: #666;
            font-size: 0.95em;
            letter-spacing: 0.3px;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            color: #667eea;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #764ba2 0%, #667eea 100%);
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 50px 20px;
            font-size: 1.15em;
            animation: slideInUp 0.5s ease-out;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        .empty-state p {
            font-weight: 500;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Attendance Tracker</h1>
            <p>Manage student attendance efficiently</p>
        </div>

        <div class="content">
            <!-- Add Student Card -->
            <div class="card">
                <h2>➕ Add Student</h2>
                <div class="success-message" id="addStudentSuccess"></div>
                <div class="error-message" id="addStudentError"></div>
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter student name" onkeypress="if(event.key==='Enter') addStudent()">
                </div>
                <button onclick="addStudent()">✓ Add Student</button>
                <div class="student-list">
                    <div style="margin-top: 25px;">
                        <h3 style="color: #667eea; margin-bottom: 15px; font-size: 1.1em;">👥 Registered Students</h3>
                        <div id="studentsList"></div>
                    </div>
                </div>
            </div>

            <!-- Mark Attendance Card -->
            <div class="card">
                <h2>📝 Mark Attendance</h2>
                <div class="success-message" id="attendanceSuccess"></div>
                <div class="error-message" id="attendanceError"></div>
                <div class="form-group">
                    <label for="studentSelect">Select Student</label>
                    <select id="studentSelect">
                        <option value="">-- Choose a student --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="attendanceDate">📅 Date</label>
                    <input type="date" id="attendanceDate">
                </div>
                <div class="form-group">
                    <label for="attendanceStatus">Status</label>
                    <select id="attendanceStatus">
                        <option value="present">✓ Present</option>
                        <option value="absent">✗ Absent</option>
                    </select>
                </div>
                <button onclick="markAttendance()">📌 Record Attendance</button>
            </div>
        </div>

        <!-- Attendance Records Card -->
        <div class="card">
            <h2>📊 Attendance Records</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('all-records')">📈 All Records</button>
                <button class="tab-btn" onclick="switchTab('student-view')">👤 Student View</button>
            </div>

            <div id="all-records" class="tab-content active">
                <div class="attendance-list" id="attendanceList"></div>
            </div>

            <div id="student-view" class="tab-content">
                <div class="form-group">
                    <label for="viewStudentSelect">Select Student</label>
                    <select id="viewStudentSelect">
                        <option value="">-- Choose a student --</option>
                    </select>
                </div>
                <div class="attendance-list" id="studentAttendanceList"></div>
                <div class="stats" id="studentStats"></div>
            </div>
        </div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('attendanceDate').valueAsDate = new Date();

        // Load initial data
        loadStudents();
        loadAttendance();

        function showMessage(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }

        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                showMessage('addStudentError', 'Please enter a student name', true);
                return;
            }

            fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('addStudentSuccess', 'Student added successfully!');
                    document.getElementById('studentName').value = '';
                    loadStudents();
                } else {
                    showMessage('addStudentError', data.message, true);
                }
            })
            .catch(error => {
                showMessage('addStudentError', 'Error adding student', true);
                console.error('Error:', error);
            });
        }

        function deleteStudent(name) {
            if (confirm(`Delete student "${name}" and all their records?`)) {
                fetch(`/api/delete-student/${encodeURIComponent(name)}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadStudents();
                        loadAttendance();
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }

        function loadStudents() {
            fetch('/api/students')
                .then(response => response.json())
                .then(data => {
                    const students = data.students;
                    
                    // Update students list
                    const listHtml = students.map(student => `
                        <div class="student-item">
                            <span class="student-name">${escapeHtml(student)}</span>
                            <button class="delete-btn" onclick="deleteStudent('${student.replace(/'/g, "\\'")}')">🗑️ Delete</button>
                        </div>
                    `).join('');
                    document.getElementById('studentsList').innerHTML = listHtml || '<div class="empty-state"><div class="empty-state-icon">📚</div><p>No students added yet</p></div>';
                    
                    // Update student select dropdowns
                    const selectHtml = '<option value="">-- Choose a student --</option>' + 
                        students.map(student => `<option value="${student}">${student}</option>`).join('');
                    document.getElementById('studentSelect').innerHTML = selectHtml;
                    document.getElementById('viewStudentSelect').innerHTML = selectHtml;
                })
                .catch(error => console.error('Error:', error));
        }

        function markAttendance() {
            const student = document.getElementById('studentSelect').value;
            const date = document.getElementById('attendanceDate').value;
            const status = document.getElementById('attendanceStatus').value;

            if (!student || !date) {
                showMessage('attendanceError', 'Please select a student and date', true);
                return;
            }

            fetch('/api/attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student, date, status })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('attendanceSuccess', 'Attendance recorded successfully!');
                    loadAttendance();
                } else {
                    showMessage('attendanceError', data.message, true);
                }
            })
            .catch(error => {
                showMessage('attendanceError', 'Error recording attendance', true);
                console.error('Error:', error);
            });
        }

        function loadAttendance() {
            fetch('/api/attendance')
                .then(response => response.json())
                .then(data => {
                    const records = data.attendance.sort((a, b) => 
                        new Date(b.date) - new Date(a.date)
                    );
                    
                    const html = records.map(record => {
                        const statusClass = record.status === 'present' ? 'present' : 'absent';
                        const statusText = record.status === 'present' ? '✓ Present' : '✗ Absent';
                        return `
                            <div class="attendance-record ${statusClass}">
                                <div class="record-header">
                                    <span class="record-student">${escapeHtml(record.student)}</span>
                                    <span class="record-status ${statusClass}">${statusText}</span>
                                </div>
                                <div class="record-date">${new Date(record.date).toLocaleDateString()}</div>
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('attendanceList').innerHTML = html || '<div class="empty-state"><div class="empty-state-icon">📭</div><p>No attendance records yet</p></div>';
                })
                .catch(error => console.error('Error:', error));
        }

        function viewStudentAttendance() {
            const student = document.getElementById('viewStudentSelect').value;
            if (!student) {
                document.getElementById('studentAttendanceList').innerHTML = '<div class="empty-state"><div class="empty-state-icon">👀</div><p>Select a student to view their records</p></div>';
                document.getElementById('studentStats').innerHTML = '';
                return;
            }

            fetch(`/api/attendance/${encodeURIComponent(student)}`)
                .then(response => response.json())
                .then(data => {
                    const records = data.attendance.sort((a, b) => 
                        new Date(b.date) - new Date(a.date)
                    );
                    
                    const present = records.filter(r => r.status === 'present').length;
                    const absent = records.filter(r => r.status === 'absent').length;
                    const total = records.length;
                    const percentage = total > 0 ? ((present / total) * 100).toFixed(1) : 0;

                    const html = records.map(record => {
                        const statusClass = record.status === 'present' ? 'present' : 'absent';
                        const statusText = record.status === 'present' ? '✓ Present' : '✗ Absent';
                        return `
                            <div class="attendance-record ${statusClass}">
                                <div class="record-header">
                                    <span class="record-student">${escapeHtml(record.student)}</span>
                                    <span class="record-status ${statusClass}">${statusText}</span>
                                </div>
                                <div class="record-date">${new Date(record.date).toLocaleDateString()}</div>
                            </div>
                        `;
                    }).join('');

                    document.getElementById('studentAttendanceList').innerHTML = html || '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No records for this student</p></div>';
                    
                    document.getElementById('studentStats').innerHTML = `
                        <div class="stat-item">
                            <span class="stat-label">📊 Total Sessions:</span>
                            <span class="stat-value">${total}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">✓ Present:</span>
                            <span class="stat-value" style="color: #27ae60;">${present}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">✗ Absent:</span>
                            <span class="stat-value" style="color: #e74c3c;">${absent}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">📈 Attendance Rate:</span>
                            <span class="stat-value">${percentage}%</span>
                        </div>
                    `;
                })
                .catch(error => console.error('Error:', error));
        }

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Load student view data if switching to it
            if (tabName === 'student-view') {
                const studentSelect = document.getElementById('viewStudentSelect');
                if (studentSelect.value) {
                    viewStudentAttendance();
                }
            }
        }

        document.getElementById('viewStudentSelect').addEventListener('change', viewStudentAttendance);

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
